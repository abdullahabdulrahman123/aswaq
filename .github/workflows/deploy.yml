name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      # روابط وصلة بتتحقن وقت البناء. سيبها فاضية → أسواق يشتغل بوضع تجريبي.
      # اضبطها من: Settings → Secrets and variables → Actions → Variables
      #
      # مفتاح جوجل في Secrets مش Variables: هو بيظهر في كود الموقع المنشور
      # بحكم إنه مفتاح متصفح، بس Secrets بيخفيه من سجلات التشغيل على الأقل.
      # لو مضبوطش، الموقع بيشتغل بالخدمة المجانية — تحديد الموقع يفضل شغّال
      # وسحب الدبوس بس مش هيجيب العنوان.
      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_WASLA_ISSUER: ${{ vars.WASLA_ISSUER }}
          VITE_WASLA_CLIENT_ID: ${{ vars.WASLA_CLIENT_ID }}
          VITE_WASLA_ACCOUNT_ORIGIN: ${{ vars.WASLA_ACCOUNT_ORIGIN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # GitHub Pages بيرجّع 404.html لأي مسار مش موجود كملف —
      # نسخة من index.html بتخلي التوجيه داخل التطبيق يشتغل على الروابط المباشرة
      - name: SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
